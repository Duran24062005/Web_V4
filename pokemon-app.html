<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .gradient-text {
            background: linear-gradient(45deg, #8a2be2, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-blue-950">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold gradient-text text-center mb-8">Pokemon App</h1>
        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="Search by name or ID"
                class="w-18 p-2 border border-gray-300 rounded">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="pokemonList"></div>
        <div class="flex justify-center mt-4">
            <button id="prevButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">
                Previous
            </button>
            <button id="nextButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Next
            </button>
        </div>
    </div>

    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pokemonModalLabel">Pokemon Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-blue-600" id="pokemonDetails"></div>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 Pokemon App. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const pokemonList = document.getElementById('pokemonList');
        const pokemonModal = new bootstrap.Modal(document.getElementById('pokemonModal'));
        const pokemonDetails = document.getElementById('pokemonDetails');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const searchInput = document.getElementById('searchInput');

        let currentPage = 0;
        const limit = 20;
        let allPokemon = [];

        async function fetchAllPokemon() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1000');
                const data = await response.json();
                return data.results;
            } catch (error) {
                console.error('Error fetching all Pokemon:', error);
            }
        }

        async function fetchPokemonDetails(url) {
            try {
                const response = await fetch(url);
                return await response.json();
            } catch (error) {
                console.error('Error fetching Pokemon details:', error);
            }
        }

        async function initializePokemon() {
            allPokemon = await fetchAllPokemon();
            displayPokemon(0);
        }

        async function displayPokemon(offset) {
            pokemonList.innerHTML = '';
            const pokemonToDisplay = allPokemon.slice(offset, offset + limit);

            for (const p of pokemonToDisplay) {
                const data = await fetchPokemonDetails(p.url);
                const card = document.createElement('div');
                card.className = 'bg-blue-600 rounded-lg shadow-md p-4 cursor-pointer transform transition-transform hover:scale-105';
                card.innerHTML = `
                    <img src="${data.sprites.front_default}" alt="${p.name}" class="w-32 h-32 mx-auto">
                    <h2 class="text-xl font-semibold gradient-text text-center mt-2 capitalize">${p.name}</h2>
                    <p class="text-center text-black">ID: ${data.id}</p>
                `;
                card.addEventListener('click', () => showPokemonDetails(data));
                pokemonList.appendChild(card);
            }

            prevButton.disabled = offset === 0;
            nextButton.disabled = offset + limit >= allPokemon.length;
        }

        function showPokemonDetails(pokemon) {
            pokemonDetails.innerHTML = `
                <div class="text-center bg-blue-600">
                    <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}" class="w-48 h-48 mx-auto">
                    <h2 class="text-2xl font-bold gradient-text mt-4 capitalize">${pokemon.name}</h2>
                    <p class="mt-2">ID: ${pokemon.id}</p>
                    <p class="mt-2">Height: ${pokemon.height / 10}m</p>
                    <p>Weight: ${pokemon.weight / 10}kg</p>
                    <h3 class="text-xl font-semibold mt-4">Types:</h3>
                    <ul class="list-none p-0">
                        ${pokemon.types.map(type => `<li class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">${type.type.name}</li>`).join('')}
                    </ul>
                    <h3 class="text-xl font-semibold mt-4">Abilities:</h3>
                    <ul class="list-none p-0">
                        ${pokemon.abilities.map(ability => `<li class="capitalize">${ability.ability.name}</li>`).join('')}
                    </ul>
                </div>
            `;
            pokemonModal.show();
        }

        prevButton.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                displayPokemon(currentPage * limit);
            }
        });

        nextButton.addEventListener('click', () => {
            currentPage++;
            displayPokemon(currentPage * limit);
        });

        searchInput.addEventListener('input', async (e) => {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm) {
                const filteredPokemon = allPokemon.filter(p =>
                    p.name.includes(searchTerm) || p.url.split('/')[6] === searchTerm
                );
                pokemonList.innerHTML = '';
                for (const p of filteredPokemon) {
                    const data = await fetchPokemonDetails(p.url);
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-md p-4 cursor-pointer transform transition-transform hover:scale-105';
                    card.innerHTML = `
                        <img src="${data.sprites.front_default}" alt="${p.name}" class="w-32 h-32 mx-auto">
                        <h2 class="text-xl font-semibold text-center mt-2 capitalize">${p.name}</h2>
                        <p class="text-center text-gray-500">ID: ${data.id}</p>
                    `;
                    card.addEventListener('click', () => showPokemonDetails(data));
                    pokemonList.appendChild(card);
                }
                prevButton.disabled = true;
                nextButton.disabled = true;
            } else {
                currentPage = 0;
                displayPokemon(0);
            }
        });

        initializePokemon();
    </script>
</body>

</html>
