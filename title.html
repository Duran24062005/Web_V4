<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            /* background-image: url('/Alexi_Dg/image/setup.jpg'); 
            background-size: cover;
            background-repeat: no-repeat; */
        }
        .bg-gradient-text {
            background-image: url('/Alexi_Dg/image/setup.jpg');

    </style>
</head>
<body>
    <div >
        <h1 class="bg-gradient-text text-3xl text-bold">Hola mundo</h1>
    </div>
    <div class="bg-gradient"></div>


    <!-- In this segment i'm making a clock -->
    <div class="conatiner flex justify-center">  
        <div class="conatiner flex justify-center items-center w-52 h-32 border border-blue bg-gradient-to-r from-cyan-500 to-slate-100 rounded-lg -rotate-45"></div>
        <div class="fixed conatiner flex justify-center items-center w-52 h-32 border border-blue bg-gradient-to-r from-cyan-500 to-slate-200 rounded-lg -rotate-12"></div>
        <div class="fixed conatiner flex justify-center items-center w-52 h-32 border border-blue bg-gradient-to-b from-cyan-500 to-blue-200 rounded-lg">
            <div class="items-center">
                <div class="flex ">
                    <h1 id="clock" class="text-3xl text-bold"></h1>
                    <p id="ampm"></p>
                </div>
                <p id="date"></p>
            </div>
        </div>
    </div>
    <!-- Scripts for the creation of de clock whith dates -->
    <script>
        const div = document.getElementById("clock");
        const amp = document.getElementById("ampm");
        const div2 = document.getElementById("date");
        const date = new Date();
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const seconds = date.getSeconds();
        const days = date.getDate();
        const months = date.getMonth() + 1;
        const year = date.getFullYear();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const monthsName = ["January", "February", "March", "April", "May",
        "June", "July", "August", "September", "October", "November", "December"];
        const daysName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday","Friday", "Saturday"];
        div.innerHTML = `${hours}:${minutes}:${seconds}`;
        amp.innerHTML = ampm;
        // div2.innerHTML = `${daysName[0]} ${monthsName[months-1]} ${year}`;
        div2.innerHTML = `${days} - ${months} - ${year}`;
    </script>
</body>
