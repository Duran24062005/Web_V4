    <!-- DG-OS intro gate: runs before first paint so the prerendered page never flashes before the intro.
         Keys must match src/lib/preferences.ts. Reduced motion (OS or "calm" setting) skips everything. -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var settings = JSON.parse(localStorage.getItem('dg-os.settings') || '{}').state || {}
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || settings.calm) return
          root.dataset.intro = 'pending'
          if (/^\/(es|en)\/(login|register|dashboard|recruiter|privated-zone)/.test(location.pathname)) return
          if (!sessionStorage.getItem('dg-os.intro-seen')) root.dataset.boot = 'pending'
        } catch (error) {}
      })()
    </script>
